# Sur rp-meliodas, dans ~/planning-relay. Lancé une fois par heure par
# planning-relay.timer (pas de conteneur permanent, donc pas de Watchtower :
# l'image latest est tirée à chaque passage).
services:
  relay:
    image: ghcr.io/rxdy/planning-relay:latest
    container_name: planning-relay
    pull_policy: always
    restart: "no"
    mem_limit: 128m
    env_file: .env
    command: ["sync"]
    volumes:
      - planning-relay-data:/data

volumes:
  planning-relay-data: {}
