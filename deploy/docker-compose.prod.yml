# Sur rp-meliodas, dans ~/planning-relay. Conteneur permanent comme les autres
# services du Pi : un passage à chaque heure pile, mis à jour par Watchtower,
# visible dans metryx (healthy / unhealthy).
services:
  relay:
    image: ghcr.io/rxdy/planning-relay:latest
    container_name: planning-relay
    restart: unless-stopped
    mem_limit: 128m
    env_file: .env
    labels:
      - com.centurylinklabs.watchtower.enable=true
    volumes:
      - planning-relay-data:/data
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  planning-relay-data: {}
