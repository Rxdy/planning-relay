# Sur rp-meliodas, dans ~/planning-relay. Conteneur permanent comme les autres
# services du Pi : un passage à chaque heure pile, mis à jour par Watchtower,
# visible dans metryx (healthy / unhealthy).
services:
  relay:
    image: ghcr.io/rxdy/planning-relay:latest
    container_name: planning-relay
    restart: unless-stopped
    mem_limit: 128m
    env_file: .env
    labels:
      - com.centurylinklabs.watchtower.enable=true
    volumes:
      - planning-relay-data:/data
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Horaires en dur (Rudy, Léa, Luis, Caroline, poubelle) : même image et même .env,
  # sans Silae ni mail ; l'état (santé) a son propre volume.
  horaires:
    image: ghcr.io/rxdy/planning-relay:latest
    container_name: planning-relay-horaires
    restart: unless-stopped
    mem_limit: 128m
    env_file: .env
    environment:
      CONNECTOR: horaires
      # Semaine en cours + la suivante : toujours 7 à 13 jours d'avance,
      # assez pour les 8 jours affichés par AbView (Charlène garde 8 semaines)
      WEEKS: "2"
      # Paon : la couleur Google Agenda du travail (config.json d'AbView : 7 → travail)
      EVENT_COLOR_ID: "7"
    labels:
      - com.centurylinklabs.watchtower.enable=true
    volumes:
      - planning-relay-horaires-data:/data
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  planning-relay-data: {}
  planning-relay-horaires-data: {}
