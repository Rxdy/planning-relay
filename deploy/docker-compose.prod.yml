# Sur rp-meliodas, dans ~/planning-relay. Conteneur permanent comme les autres
# services du Pi : un passage à chaque heure pile, mis à jour par Watchtower,
# visible dans metryx (healthy / unhealthy).
services:
  relay:
    image: ghcr.io/rxdy/planning-relay:latest
    container_name: planning-relay
    restart: unless-stopped
    mem_limit: 128m
    env_file: .env
    environment:
      # Les horaires en dur (Rudy, Léa, Luis, Caroline, poubelle) dans le même conteneur :
      # passage avant Silae, état dans /data/horaires, compteur d'échecs à part
      HORAIRES_AUSSI: "1"
      # Semaine en cours + la suivante : 7 à 13 jours d'avance, assez pour les 8 jours d'AbView
      HORAIRES_WEEKS: "2"
      # Paon : la couleur Google Agenda du travail (config.json d'AbView : 7 → travail)
      HORAIRES_COLOR_ID: "7"
    labels:
      - com.centurylinklabs.watchtower.enable=true
    volumes:
      - planning-relay-data:/data
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  planning-relay-data: {}
