[project]
name = "planning-relay"
version = "0.1.0"
description = "Recopie le planning de Charlène (Silae RH Suite) dans le Google Agenda de l'affichage familial."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "google-api-python-client>=2.130",
    "google-auth>=2.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
planning-relay = "planning_relay.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
