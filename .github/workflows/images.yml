# Fusion dans dev : tests, puis build des seuls services dont les sources ont changé, puis manifeste (tag dev).
# C'est le seul endroit où une image est construite : staging, prod et les versions reprennent ces images (promotion.yml).
# Détail du fonctionnement : .github/images/images.sh
name: Images

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: images-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/ci.yml

  plan:
    name: Services à construire
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      services: ${{ steps.plan.outputs.services }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: plan
        run: echo "services=$(.github/images/images.sh plan "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.service }}
    needs: plan
    if: needs.plan.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.services) }}
    steps:
      - uses: actions/checkout@v7
      - name: Architectures
        id: conf
        run: echo "plateformes=$(jq -r .plateformes .github/images/services.json)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.contexte }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.cible }}
          platforms: ${{ steps.conf.outputs.plateformes }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ matrix.empreinte }}
            ${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  manifeste:
    name: Manifeste (dev)
    needs: [plan, build]
    if: always() && needs.plan.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: oras-project/setup-oras@v1
      - run: .github/images/images.sh manifeste "$GITHUB_SHA" "$RUNNER_TEMP/manifeste.json"
      - run: .github/images/images.sh etiqueter "$RUNNER_TEMP/manifeste.json" dev
      - uses: actions/upload-artifact@v7
        with:
          name: manifeste
          path: ${{ runner.temp }}/manifeste.json
