# Chaque lundi : supprime les images qui n'ont jamais été promues (ni dev, staging, prod, latest, ni version)
# et qui n'ont pas bougé depuis 14 jours. Lancé à la main, il ne fait que lister (essai) sauf si on décoche.
name: Nettoyage des images

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      essai:
        description: "Essai : lister sans supprimer"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  nettoyer:
    name: Nettoyage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          GH_TOKEN: ${{ github.token }}
          ESSAI: ${{ github.event_name == 'workflow_dispatch' && inputs.essai || false }}
        run: .github/images/images.sh nettoyer 14 "$ESSAI"
