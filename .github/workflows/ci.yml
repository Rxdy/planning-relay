name: CI

on:
  # Tests : sur chaque PR, et appelés par images.yml avant le build qui suit une fusion dans dev
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -q
